server:
  port: ${PORT:8082}
  servlet:
    context-path: /
  shutdown: graceful

spring:
  application:
    name: cart-service

  threads:
    virtual:
      enabled: true
  
  datasource:
    url: jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/ekart_cart_service?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: CartServiceHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
    open-in-view: false
  
  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  boot:
    admin:
      client:
        url:
        - ${SPRING_BOOT_ADMIN_URL:http://localhost:1111/}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
      pricingService:
        sliding-window-size: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 5s

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
      validate-group-membership: false
  health:
    redis:
      enabled: false


app:
  name: ${spring.application.name}
  version: 1.0.0
  cart:
    max-items: 50
    expiry-hours: 24
    reservation-timeout-minutes: 15
  client:
    inventory-service:
      url: http://localhost:8080/api/v1/products
    order-service:
      url: http://localhost:8080/api/v1/orders
  payment:
    tax-rate: 0.18
    free-shipping-threshold: 500
    standard-shipping-fee: 50
    currency-code: INR
    country-code: IN

logging:
  level:
    root: INFO
    com.infy.ekart.cartservice: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.infy.ekart.cartservice.controller
