server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 3600000
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.reactive.ReactiveSecurityAutoConfiguration
  cloud:
    gateway:
      routes:
        # ==================== SWAGGER DOCS (must come first) ====================
        - id: auth-service-docs
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/v3/api-docs
          filters:
            - RewritePath=/auth/v3/api-docs, /v3/api-docs

        - id: product-service-docs
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/product-docs
          filters:
            - RewritePath=/product-docs, /v3/api-docs

        - id: cart-service-docs
          uri: ${CART_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/carts/v3/api-docs
          filters:
            - RewritePath=/api/v1/carts/v3/api-docs, /v3/api-docs

        - id: order-service-docs
          uri: ${ORDER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/orders/v3/api-docs
          filters:
            - RewritePath=/api/v1/orders/v3/api-docs, /v3/api-docs

        - id: payment-service-docs
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/payments/v3/api-docs
          filters:
            - RewritePath=/api/v1/payments/v3/api-docs, /v3/api-docs

        - id: notification-service-docs
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/email/v3/api-docs
          filters:
            - RewritePath=/api/v1/email/v3/api-docs, /v3/api-docs

        # ==================== ACTUAL SERVICE ROUTES ====================
        # ---------- Auth Service ----------
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/**
          # If auth-service expects paths WITHOUT the /auth prefix, add:
          # filters:
          #   - RewritePath=/auth/(?<segment>.*), /$\{segment}

        # ---------- Auth Service – Profile Addresses ----------
        - id: auth-service-addresses
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/addresses/**
          filters:
            - RewritePath=/api/auth/addresses, /api/addresses
            - PreFlightFilter

        # ---------- Product Service ----------
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/products/**, /api/v1/categories/**, /api/v1/brands/**, /api/v1/search/**

        # ---------- Cart Service ----------
        - id: cart-service
          uri: ${CART_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/carts/**
          filters:
            - PreFlightFilter

        # ---------- Order Service ----------
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - PreFlightFilter

        # ---------- Order Service – Shipping Addresses ----------
        - id: order-service-addresses
          uri: ${ORDER_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/addresses/**
          filters:
            - PreFlightFilter

        # ---------- Payment Service ----------
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - PreFlightFilter

        # ---------- Notification Service ----------
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/email/**, /api/v1/send-welcome, /api/v1/verify-code,
              /api/v1/order-confirmation, /api/v1/forgot-password, /api/v1/verify-google,
              /api/v1/shipping-update, /api/v1/payment-confirmation

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "https://ekart-frontend-g20a.onrender.com"
              - "http://localhost:5173"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

  boot:
    admin:
      client:
        url: ${SPRING_BOOT_ADMIN_URL:http://localhost:1111/}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

resilience4j:
  circuitbreaker:
    instances:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10000ms

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    urls-primary-name: eKart API Gateway
    urls:
      - name: auth-service
        url: /auth/v3/api-docs
      - name: product-service
        url: /product-docs
      - name: cart-service
        url: /api/v1/carts/v3/api-docs
      - name: order-service
        url: /api/v1/orders/v3/api-docs
      - name: payment-service
        url: /api/v1/payments/v3/api-docs
      - name: notification-service
        url: /api/v1/email/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: '*'

logging:
  level:
    com.infy.ekart: DEBUG