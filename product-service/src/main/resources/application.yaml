server:
  port: ${PORT:8083}

spring:
  application:
    name: product-service

  # MySQL Database Configuration
  datasource:
    url: jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/ekart_product_service?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: ProductServiceHikariCP
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Disable Redis and Kafka auto-configuration
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  boot:
    admin:
      client:
        url:
        - ${SPRING_BOOT_ADMIN_URL:http://Admin-Server:1111/}

# Eureka Service Discovery
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://Service-Registry:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

# Application Configuration
app:
  name: ${spring.application.name}
  version: 1.0.0
  client:
    cart-service:
      url: ${APP_CLIENT_CART_SERVICE_URL}

# Logging
logging:
  level:
    root: INFO
    com.infy.ekart.productservice: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
# Springdoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    urls:
    - name: product-service
      url: /product-doc
  packages-to-scan: com.infy.ekart.productservice.controller
  show-actuator: false
  show-spring-cloud-functions: false
